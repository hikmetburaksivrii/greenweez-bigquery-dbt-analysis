# schema.yml
version: 2
sources:
    - name: raw
      schema: gwz_dbt_raw_data
      description: source dataset
      tables:
        - name: sales
          identifier: raw_gz_sales
          description: "Daily sales transactions and order line details."
          config:
            freshness:
              error_after: 
                count: 90 
                period: day
            loaded_at_field: "CAST(date_date AS TIMESTAMP)"

          columns: 
            - name: date_date
              description: "The specific date when the purchase transaction occurred."
            - name: orders_id
              description: "Unique identifier for each order."
            - name: pdt_id
              description: "Unique identifier for each product sold."
            - name: revenue
              description: "Gross revenue generated from the sale."
            - name: quantity
              description: "The total number of product units ordered."
          tests:
            - unique:
                arguments: 
                  column_name: "orders_id || '-' || pdt_id"
            #- dbt_utils.unique_combination_of_columns:
                #arguments:
                  #combination_of_columns:
                    #- orders_id
                    #- pdt_id
        - name: product
          identifier: raw_gz_product
          description: "Master catalog containing product details and cost prices."
          columns:
            - name: products_id
              description: "Unique identifier for the product."
              tests:
                - unique
                - not_null
            - name: purchase_price
              description: "The unit internal wholesale cost price of the product."
        - name: ship
          identifier: raw_gz_ship
          description: "Logistics data including shipping fees and operational costs per order."
          columns:
            - name: orders_id
              description: "Unique identifier for the order."
              tests:
                - unique
                - not_null
            - name: shipping_fee
              description: "The delivery amount charged to the customer for shipping."
            - name: logcost
              description: "Internal logistics and warehouse operational cost for processing the order."
            - name: ship_cost
              description: "The actual shipping amount paid to the transport carrier company."

        - name: adwords
          identifier: raw_gz_adwords
          description: "Daily ad performance data from Google Ads."
          columns:
              - name: date_date
                description: "Date of the ad performance metrics."
              - name: paid_source
                description: "Marketing channel source name (Adwords)."
              - name: campaign_key
                description: "Unique identifier for the ad campaign."
              - name: camPGN_name
                description: "Name of the marketing campaign."
              - name: ads_cost
                description: "Total cost spent on the campaign."
              - name: impression
                description: "Total number of ad impressions."
              - name: click
                description: "Total number of clicks received."

        - name: bing
          identifier: raw_gz_bing
          description: "Daily ad performance data from Bing Ads."
          columns:
            - name: date_date
              description: "Date of the ad performance metrics."
            - name: paid_source
              description: "Marketing channel source name (Bing)."
            - name: campaign_key
              description: "Unique identifier for the ad campaign."
            - name: camPGN_name
              description: "Name of the marketing campaign."
            - name: ads_cost
              description: "Total cost spent on the campaign."
            - name: impression
              description: "Total number of ad impressions."
            - name: click
              description: "Total number of clicks received."

        - name: criteo
          identifier: raw_gz_criteo
          description: "Daily ad performance data from Criteo."
          columns:
            - name: date_date
              description: "Date of the ad performance metrics."
            - name: paid_source
              description: "Marketing channel source name (Criteo)."
            - name: campaign_key
              description: "Unique identifier for the ad campaign."
            - name: camPGN_name
              description: "Name of the marketing campaign."
            - name: ads_cost
              description: "Total cost spent on the campaign."
            - name: impression
              description: "Total number of ad impressions."
            - name: click
              description: "Total number of clicks received."

        - name: facebook
          identifier: raw_gz_facebook
          description: "Daily ad performance data from Facebook Ads."
          columns:
            - name: date_date
              description: "Date of the ad performance metrics."
            - name: paid_source
              description: "Marketing channel source name (Facebook)."
            - name: campaign_key
              description: "Unique identifier for the ad campaign."
            - name: camPGN_name
              description: "Name of the marketing campaign."
            - name: ads_cost
              description: "Total cost spent on the campaign."
            - name: impression
              description: "Total number of ad impressions."
            - name: click
              description: "Total number of clicks received."