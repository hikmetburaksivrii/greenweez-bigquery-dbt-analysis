version: 2

models:
  - name: int_sales_margin
    description: "Enriches sales data with purchase price and calculates purchase cost and margin per product."
  - name: int_orders_margin
    description: "Aggregates sales margin data at order level, calculating total revenue, quantity, purchase cost and margin per order."
  - name: int_order_operational
    description: "Enriches order margin data with shipping details to calculate operational margin per order."
  - name: int_campaigns
    description: "Data from all campaigns."
  - name: int_campaigns_day
    description: "Daily campaign data."